; Build with PlatformIO:   pio run -d firmware            (Nano, old bootloader)
;                          pio run -d firmware -e uno -t upload
; Or open firmware/NixieCounter/NixieCounter.ino in the Arduino IDE.
[platformio]
src_dir = NixieCounter
default_envs = nanoatmega328

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200

[env:uno]
board = uno

[env:nanoatmega328]
board = nanoatmega328

[env:nanoatmega328new]
board = nanoatmega328new

[env:megaatmega2560]
board = megaatmega2560
